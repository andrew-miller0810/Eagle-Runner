name: Career Head-to-Head

on:
  workflow_dispatch:
    inputs:
      target_year:
        description: 'Which season year to run for (leave blank for current)'
        required: false
        default: ''
      league:
        description: 'Which league to run for (leave blank for all)'
        required: false
        default: ''
  schedule:
    - cron: '0 12 * * 2'  # adjust to whenever your weekly matchups lock

jobs:
  determine-leagues:
    uses: ./.github/workflows/_shared-league-matrix.yml
    with:
      league_filter: ${{ inputs.league }}
    secrets: inherit

  career-h2h:
    needs: determine-leagues
    timeout-minutes: 10
    strategy:
      matrix:
        league: ${{ fromJson(needs.determine-leagues.outputs.leagues) }}
    environment: ${{ matrix.league }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: andrew-miller0810/Eagle
          token: ${{ secrets.EAGLE_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run career h2h report
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          DISCORD_WEBHOOK_H2H: ${{ secrets.DISCORD_WEBHOOK_H2H }}
          LEAGUE_SLUG: ${{ matrix.league }}
          TARGET_YEAR: ${{ inputs.target_year }}
        run: python -m scripts.reports.career_h2h